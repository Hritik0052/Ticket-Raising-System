{% extends "base.html" %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            {% if messages %}
                {% for message in messages %}
                    {% if message.tags != 'success' %} 
                        <div class="alert alert-{{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endif %}
                {% endfor %}
            {% endif %}
            <div class="card p-5 shadow-sm bg-primary text-white text-center rounded">
                <h2 class="mb-3">Ticket Submitted Successfully 🎉</h2>
                <p class="lead">Your Ticket ID: <strong>{{ ticket_id }}</strong></p>
                <a href="{% url 'main_page' %}" class="btn btn-light mt-4 fs-bold">Back to Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
