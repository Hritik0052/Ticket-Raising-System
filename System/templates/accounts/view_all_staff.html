{% extends "base.html" %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-12">
                <h2 class="text-center mb-4">All Staff Member</h2>
                <table class="table table-striped table-hover shadow-sm rounded-3 overflow-hidden">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">Name</th>
                            <th scope="col">Role</th>
                            <th scope="col">Department</th>
                            <th scope="col">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for staff in all_staff %}
                            <tr>
                                <td>{{ staff.username }}</td>
                                <td>{{ staff.role }}</td>
                                <td>{{ staff.department.name }}</td>
                                <td>
                                    <!-- View -->
                                    <a href="{% url 'view_staff' staff.id %}" class="text-decoration-none fs-5 me-2">
                                        <i class="fa-solid fa-eye text-primary" title="View Details" style="cursor: pointer;"></i>
                                    </a>

                                    <!-- Edit -->
                                    <a href="{% url 'edit_staff' staff.id %}" class="text-decoration-none fs-5 me-2">
                                        <i class="fa-solid fa-pen-to-square text-success" title="Edit Staff" style="cursor: pointer;"></i>
                                    </a>

                                    <!-- Delete -->
                                    <a href="{% url 'delete_staff' staff.id %}" 
                                        onclick="return confirm('Are you sure you want to delete this staff member?');"
                                        class="text-decoration-none fs-5">
                                        <i class="fa-solid fa-trash text-danger" title="Delete Staff" style="cursor: pointer;"></i>
                                    </a>
                                </td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
        </div>
    </div>
</div>
{% endblock %}
